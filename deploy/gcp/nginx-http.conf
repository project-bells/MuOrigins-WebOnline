# Install ONLY on the NEW staging VM; certificate setup upgrades this to HTTPS.
map $http_upgrade $mu_connection { default upgrade; '' close; }
limit_conn_zone $binary_remote_addr zone=mu_connections:10m;
server {
  listen 80;
  server_name playonline-staging.muorigins.online;
  root /srv/muweb/static;
  index smoke.html;
  add_header Referrer-Policy no-referrer always;
  location /mu/ {
    limit_conn mu_connections 8;
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mu_connection;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
  location = /healthz { proxy_pass http://127.0.0.1:18081/healthz; }
  location / { try_files $uri $uri/ =404; }
}
