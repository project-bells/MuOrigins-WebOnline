# Included only inside the existing playonline HTTPS server block.
location = /network-lab/smoke.html {
    auth_basic "MU network lab";
    auth_basic_user_file /etc/nginx/muweb-lab.htpasswd;
    alias /srv/muweb-lab/smoke.html;
    default_type text/html;
    add_header Cache-Control "no-store";
}
location = /network-lab/mu/connect {
    auth_basic "MU network lab";
    auth_basic_user_file /etc/nginx/muweb-lab.htpasswd;
    proxy_pass http://127.0.0.1:18081/mu/connect;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}
location ^~ /network-lab/ { return 404; }
