# Include inside http{}. Provision a real staging certificate separately.
map $http_upgrade $mu_connection { default upgrade; '' close; }
limit_conn_zone $binary_remote_addr zone=mu_connections:10m;
server {
  listen 443 ssl;
  server_name playonline-staging.muorigins.online;
  ssl_certificate /etc/nginx/tls/staging/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/staging/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /srv/mu-staging;
  add_header Referrer-Policy no-referrer always;
  location /mu/ {
    limit_conn mu_connections 8;
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mu_connection;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
  location / { try_files $uri $uri/ =404; }
}
